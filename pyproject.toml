[project]
name = "ai-video-analytics"
version = "0.1.0"
description = "AI CCTV Video Analytics & Employee Attendance Dashboard"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "python-dotenv>=1.0.0",
    "insightface>=0.7.3",
    "onnxruntime>=1.17.0",
    "ultralytics>=8.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
]

[tool.vercel]
entrypoint = "run_dashboard:app"
